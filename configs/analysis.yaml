# Teams, pitch calibration and statistics. Thresholds are tuned on the valid split, never on test.

teams:
  stride: 5                 # one frame in 5 per clip for the colours (consecutive frames are correlated)
  min_height: 40            # px: smaller boxes give few torso pixels
  k: 3                      # two teams + one cluster for referees, goalkeepers and noise
  l_weight: 0.5             # weight of the lightness L in the colour distance (shadows)
  margin: 0.15              # relative margin |d0 - d1| / (d0 + d1)
  max_dist: 25.0            # farther than this from both teams -> unknown
  min_frames: 3             # valid frames needed to name the team of a track
  min_pixels: 20
  hsv_low: [35, 40, 40]     # grass, as in the pitch mask
  hsv_high: [85, 255, 255]

calibration:
  thr_px: 4.0               # inlier threshold of RANSAC, pixels at 1920 x 1080
  max_iter: 300
  min_inliers: 20
  max_median_px: 2.5
  max_circle_m: 0.6
  min_hull_frac: 0.05
  propagate: true           # frames without enough lines: homography moved from a neighbour
  propagate_max_s: 2.0
  propagated_max_median_px: 4.0
  motion_scale: 0.5

statistics:
  margin_m: 5.0             # positions farther than this outside the pitch are invalid
  max_gap_s: 0.5            # a longer gap cuts the track: no distance across it
  smooth_s: 0.4             # eval_statistics.py compares several settings
  step_s: 0.2
  max_speed: 12.0           # m/s: faster steps are artefacts
  min_duration_s: 2.0       # shorter segments are not reported
  pixel_sigma: 2.0          # foot-point noise in pixels (scripts/estimate_noise.py)
